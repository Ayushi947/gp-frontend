services:
  app:
    image: ${FRONTEND_IMAGE}
    container_name: gp-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      NEXTAUTH_URL: https://app-dev.glidingpath.co
      NEXT_PUBLIC_API_BASE_URL: http://13.204.9.137:9090/v1/api
      NEXTAUTH_SECRET: SqdDXzpm+HEvHh2rRLksZbJ6gxs861LEvyz9ZlUlMp4=

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://13.204.9.137:3000/api/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
